<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0E1A2B">
  <title>🎄</title>
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .admin { max-width: 560px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom)); position: relative; z-index: 1; }
    .a-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
    .a-head h1 { font-family: var(--serif); font-size: 30px; margin: 0; }
    .a-head-actions { display: flex; gap: 8px; }
    .a-repo { margin: 0 0 12px; }
    .a-card { background: #13233a; border: 1px solid rgba(191,215,234,.15); border-radius: 18px; padding: 18px 16px; margin: 0 0 14px; display: flex; flex-direction: column; gap: 12px; }
    .a-card h2 { font-family: var(--serif); font-size: 24px; margin: 0; }
    .a-hint { margin: 0; color: var(--snow-dim); font-size: 14px; }
    .a-msg { margin: 0; color: var(--gold-2); min-height: 1.4em; }
    .a-field { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--snow-dim); }
    .admin input[type=text], .admin input[type=password], .admin input[type=number], .admin input[type=datetime-local], .admin select {
      min-height: 46px; border-radius: 12px; border: 1px solid rgba(191,215,234,.3); background: rgba(191,215,234,.08);
      color: var(--snow); padding: 0 12px; font: inherit; width: 100%; min-width: 0;
    }
    .admin select option { color: #111; }
    .admin input[type=file] { color: var(--snow-dim); font: inherit; }
    .a-radios { display: flex; flex-direction: column; gap: 8px; }
    .a-radios label { display: flex; gap: 8px; align-items: center; }
    .a-radios input { width: 18px; height: 18px; accent-color: var(--gold); }
    .a-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .a-row input[type=text] { flex: 1 1 140px; }
    .a-stack { display: flex; flex-direction: column; gap: 8px; }
    .a-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
    .a-list li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid rgba(191,215,234,.1); }
    .a-list li.a-col { flex-direction: column; align-items: stretch; }
    .a-preview img { max-width: 100%; max-height: 300px; border-radius: 12px; display: block; }
    .btn-sm { min-height: 38px; padding: 0 14px; font-size: 14px; }
    a.btn { text-decoration: none; }
    body.busy { cursor: progress; }
    body.busy .a-card { opacity: .6; pointer-events: none; }
  </style>
</head>
<body>
  <main class="admin" id="admin"><p class="a-hint">Загружаю…</p></main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="assets/js/admin.js"></script>
</body>
</html>
