<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0E1A2B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Под ёлочкой">
  <meta property="og:title" content="🎄">
  <meta property="og:description" content="Тсс…">
  <title>🎄</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <canvas id="snow" aria-hidden="true"></canvas>
  <div id="preview-banner" class="preview-banner" hidden></div>

  <!-- Вход -->
  <main id="screen-login" class="screen login" hidden>
    <div class="login-ball" aria-hidden="true">
      <svg viewBox="0 0 120 140"><use href="#ball-icon"/></svg>
    </div>
    <h1 class="login-title">Стоп. Частная территория кошки.</h1>
    <p class="login-sub">Введи волшебное слово — то самое, с открытки.</p>
    <form id="login-form" class="login-form" autocomplete="off">
      <label class="visually-hidden" for="pass">Волшебное слово</label>
      <input id="pass" name="pass" type="password" placeholder="Волшебное слово" autocomplete="current-password" autocapitalize="off" spellcheck="false" required>
      <label class="remember"><input id="remember" type="checkbox" checked> Запомнить на этом телефоне</label>
      <button class="btn btn-gold" type="submit" id="login-btn">Зажечь ёлку</button>
      <p id="login-msg" class="login-msg" role="status" aria-live="polite"></p>
    </form>
  </main>

  <!-- Ёлка -->
  <div id="screen-tree" class="screen tree-screen" hidden>
    <header class="topbar">
      <div class="brand" id="brand">Под ёлочкой</div>
      <div class="topbar-right">
        <button class="flakes" id="flakes" title="Снежинки" aria-label="Снежинки">❄ <b id="flakes-n">0</b></button>
        <button class="icon-btn" id="menu-btn" aria-label="Меню" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>
    <nav id="menu" class="menu" hidden>
      <button data-go="#/rules">📜 Правила</button>
      <button data-go="#/achievements">🏅 Ачивки</button>
      <button data-go="#/welcome">✉️ Первое письмо</button>
      <button id="logout-btn">🚪 Выйти на этом телефоне</button>
    </nav>

    <section class="countdown" aria-live="polite">
      <div class="countdown-label" id="cd-label">До следующего шара</div>
      <div class="countdown-value" id="cd-value">—</div>
    </section>

    <div class="tree-wrap">
      <svg id="tree" class="tree" viewBox="0 0 360 500" role="group" aria-label="Ёлка с шарами"></svg>
    </div>
    <p class="tree-tip" id="tree-tip"></p>

    <nav class="bottom-nav" aria-label="Разделы">
      <button data-tab="#/" class="active"><span class="bn-ico">🎄</span><span>Ёлка</span></button>
      <button data-tab="#/wardrobe"><span class="bn-ico">👗</span><span>Гардероб</span></button>
      <button data-tab="#/tournament"><span class="bn-ico">🏆</span><span>Турнир</span></button>
      <button data-tab="#/shop"><span class="bn-ico">🏪</span><span>Лавка</span></button>
    </nav>
  </div>

  <!-- Оверлей: письмо, правила, тизер -->
  <div id="overlay" class="overlay" hidden>
    <div class="overlay-inner" id="overlay-inner" role="dialog" aria-modal="true"></div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- Иконки -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <radialGradient id="g-ball-login" cx="38%" cy="35%" r="70%">
        <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
        <stop offset=".25" stop-color="#E8C27A"/>
        <stop offset="1" stop-color="#7a5a24"/>
      </radialGradient>
      <symbol id="ball-icon" viewBox="0 0 120 140">
        <line x1="60" y1="0" x2="60" y2="22" stroke="#E8C27A" stroke-width="2"/>
        <rect x="50" y="20" width="20" height="12" rx="3" fill="#E8C27A"/>
        <circle cx="60" cy="84" r="52" fill="url(#g-ball-login)"/>
        <circle cx="60" cy="84" r="52" fill="#BFD7EA" opacity=".35"/>
        <path d="M60 52v64M32 68l56 32M88 68l-56 32" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".75"/>
      </symbol>
    </defs>
  </svg>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
