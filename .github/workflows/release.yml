name: Открытие шаров
# Шары открывает кошка кнопкой в админке (или Run workflow здесь)
on:
  workflow_dispatch:
    inputs:
      open:
        description: 'Что открыть сразу (id через запятую: w1, w2, p1, w3, w4, w5, w6, ny). Пусто — то, чему пришло время'
        required: false
        default: ''
permissions:
  contents: write
  pages: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Выложить ключи наступивших шаров
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OPEN: ${{ inputs.open }}
          # ручной запуск ждёт до 5,5 ч вперёд — можно нажать Run workflow утром в день шара
          LOOKAHEAD_MIN: ${{ github.event_name == 'workflow_dispatch' && '330' || '25' }}
        run: |
          git config user.name advent
          git config user.email advent@users.noreply.github.com
          node tools/release.mjs
